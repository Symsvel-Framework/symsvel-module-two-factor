name: QA
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
concurrency:
  group: two-factor-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: [self-hosted, linux, ARM64, symsvel]
    steps:
      - uses: actions/checkout@v5
      - name: Verify PHP 8.4 and sodium
        run: |
          php -v
          php -r 'if (PHP_VERSION_ID < 80400 || PHP_VERSION_ID >= 80500 || !extension_loaded("sodium")) exit(1);'
      - name: Install private Composer dependencies
        env:
          SYMSVEL_READ_TOKEN: ${{ secrets.SYMSVEL_READ_TOKEN }}
        run: |
          test -n "$SYMSVEL_READ_TOKEN"
          for repo in symsvel-module-auth symsvel-module-settings symsvel-module-acls; do
            if ! curl --fail --silent --show-error --output /dev/null \
                --header "Authorization: Bearer $SYMSVEL_READ_TOKEN" \
                --header "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/Symsvel-Framework/$repo"; then
              echo "::error::SYMSVEL_READ_TOKEN cannot read $repo"
              exit 1
            fi
          done
          export COMPOSER_AUTH="$(php -r 'echo json_encode(["github-oauth" => ["github.com" => getenv("SYMSVEL_READ_TOKEN")]], JSON_THROW_ON_ERROR);')"
          composer install --no-interaction --prefer-dist --no-progress
      - name: Lint PHP
        run: find back/src back/tests Migration -type f -name '*.php' -print0 | xargs -0 -r -n 1 php -l
      - run: composer qa

  bo-frontend:
    runs-on: [self-hosted, linux, ARM64, symsvel]
    steps:
      - uses: actions/checkout@v5
      - name: Checkout BO host on dev
        uses: actions/checkout@v4
        with:
          repository: Symsvel-Framework/symsvel-bo
          ref: dev
          path: assembled-bo
          token: ${{ secrets.SYMSVEL_READ_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: assembled-bo/package-lock.json
      - name: Assemble optional TwoFactor module
        run: |
          mkdir -p assembled-bo/src/lib/modules/two-factor/routes/two-factor
          mkdir -p assembled-bo/src/routes/two-factor
          cp bo/src/routes/two-factor/+page.svelte assembled-bo/src/lib/modules/two-factor/routes/two-factor/+page.svelte
          mkdir -p assembled-bo/src/lib/translations/two-factor
          cp bo/src/lib/translations/*.ts assembled-bo/src/lib/translations/two-factor/
          cat > assembled-bo/src/routes/two-factor/+page.svelte <<'ROUTE'
          <script lang="ts">
            import ModulePage from '#lib/modules/two-factor/routes/two-factor/+page.svelte';
          </script>
          <ModulePage />
          ROUTE
          mkdir -p assembled-bo/tests
          cp tests/bo-second-factor.e2e.ts assembled-bo/tests/bo-second-factor.e2e.ts
      - name: Validate assembled BO static Svelte
        working-directory: assembled-bo
        run: |
          npm ci --no-audit --no-fund
          npm run format
          npm run check
          npm run lint
          npm run build
          npx playwright install chromium
          npx playwright test tests/bo-second-factor.e2e.ts

  app-frontend:
    runs-on: [self-hosted, linux, ARM64, symsvel]
    steps:
      - uses: actions/checkout@v5
      - name: Checkout APP host on dev
        uses: actions/checkout@v4
        with:
          repository: Symsvel-Framework/symsvel-app
          ref: dev
          path: assembled-app
          token: ${{ secrets.SYMSVEL_READ_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: assembled-app/package-lock.json
      - name: Assemble optional TwoFactor module
        run: |
          mkdir -p assembled-app/src/lib/modules/two-factor/routes/two-factor
          mkdir -p assembled-app/src/routes/two-factor
          cp app/src/routes/two-factor/+page.svelte assembled-app/src/lib/modules/two-factor/routes/two-factor/+page.svelte
          mkdir -p assembled-app/src/lib/translations/two-factor
          cp app/src/lib/translations/*.ts assembled-app/src/lib/translations/two-factor/
          mkdir -p assembled-app/tests
          cp tests/app-qr.e2e.ts assembled-app/tests/app-qr.e2e.ts
          cat > assembled-app/src/routes/two-factor/+page.svelte <<'ROUTE'
          <script lang="ts">
            import ModulePage from '#lib/modules/two-factor/routes/two-factor/+page.svelte';
          </script>
          <ModulePage />
          ROUTE
      - name: Validate assembled APP static Svelte
        working-directory: assembled-app
        run: |
          npm ci --no-audit --no-fund
          npm run format
          npm run check
          npm run lint
          npm run build
          npx playwright install chromium
          npx playwright test tests/app-qr.e2e.ts
